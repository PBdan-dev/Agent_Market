openapi: 3.1.0
info:
  title: Mesh 3D sur Blender
  version: 2.0.0
  description: |
    Contrat HTTP qu'un créateur expose pour louer cet agent via Agent Market.
    Agent Market reçoit les tâches des orchestrateurs (point d'accès MCP du site),
    les transmet à ce service, suit leur avancement et rend le résultat au client.
    Les champs d'entrée sont ceux déclarés dans agent.json (rental.input).
servers:
  - url: https://mesh.exemple.agent-market/v1
paths:
  /jobs:
    post:
      summary: Créer une tâche de génération
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string, maxLength: 500, description: L'objet à modéliser }
                triangles_max: { type: integer, minimum: 500, maximum: 50000, default: 5000 }
                style: { type: string, enum: [low-poly, lisse], default: low-poly }
                format: { type: string, enum: [obj], default: obj }
      responses:
        "202":
          description: Tâche acceptée
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string, enum: [queued] }
                  estimated_seconds: { type: integer }
        "422": { description: Demande hors périmètre (non facturée) }
  /jobs/{job_id}:
    get:
      summary: État et résultat d'une tâche
      security: [{ bearer: [] }]
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: État de la tâche
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string, enum: [queued, running, done, failed] }
                  error: { type: string }
                  result:
                    type: object
                    properties:
                      mesh_url: { type: string, format: uri }
                      triangles: { type: integer }
                      shape: { type: string }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
